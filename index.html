<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Boutique</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>La Boutique</h1>
    <div id="cart-icon">🛒 <span id="cart-count">0</span></div>
  </header>

  <main class="product-grid">
    <div class="product" data-id="1" data-title="Reloj Rosa Minimalista" data-price="6500">
      <img src="reloj1.jpg" alt="Reloj Rosa Minimalista">
      <h3>Reloj Rosa Minimalista</h3>
      <p>$6.500</p>
      <button class="add-to-cart">Agregar al carrito</button>
    </div>

    <div class="product" data-id="2" data-title="Reloj Beige Minimalista" data-price="7200">
      <img src="reloj2.jpg" alt="Reloj Beige Minimalista">
      <h3>Reloj Beige Minimalista</h3>
      <p>$7.200</p>
      <button class="add-to-cart">Agregar al carrito</button>
    </div>
  </main>

  <section id="cart-modal" class="hidden">
    <div class="cart-content">
      <h2>Tu carrito</h2>
      <ul id="cart-items"></ul>
      <p>Total: $<span id="cart-total">0</span></p>
      <button id="checkout-btn">Pagar con Mercado Pago</button>
      <button id="close-cart">Cerrar</button>
    </div>
  </section>

  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <script src="main.js"></script>
</body>
</html>
